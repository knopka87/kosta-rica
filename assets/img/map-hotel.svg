  <path d="M440,450 V612 H930" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M440,450 V612 H930" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="10 10" fill="none"/>
  <rect x="470" y="556" width="478" height="46" rx="10" fill="#ffffff" stroke="#e7e0d3"/>
  <text x="488" y="575" font-size="14" font-weight="700" fill="#0f766e">↓ Ruta 27 → Сан-Хосе (SJO)</text>

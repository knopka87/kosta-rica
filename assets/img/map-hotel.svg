  <!-- океан -->
  <path d="M0,0 H175 Q205,80 175,160 Q145,240 180,330 Q215,420 178,510 Q150,590 185,660 H0 Z" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity=".55" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M30,120 q18,-12 36,0 t36,0"/>
    <path d="M60,260 q18,-12 36,0 t36,0"/>
    <path d="M35,400 q18,-12 36,0 t36,0"/>
    <path d="M70,540 q18,-12 36,0 t36,0"/>
  </g>
  <text x="86" y="340" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="2" transform="rotate(-90 86 340)" text-anchor="middle">OCÉANO PACÍFICO · ТИХИЙ ОКЕАН</text>

  <!-- пляж -->
  <path d="M175,0 Q205,80 175,160 Q145,240 180,330 Q215,420 178,510 Q150,590 185,660 H262 Q235,590 262,510 Q295,420 258,330 Q225,240 262,160 Q292,80 262,0 Z" fill="#f5e6c8"/>
  <text x="222" y="500" fill="#8a7448" font-size="14" font-weight="700" letter-spacing="1" transform="rotate(-90 222 500)" text-anchor="middle">PLAYA TAMARINDO</text>

  <!-- дорога в LIR (сверху) -->
  <path d="M440,250 V70 H690" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M440,250 V70 H690" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="10 10" fill="none"/>
  <rect x="452" y="10" width="496" height="46" rx="10" fill="#ffffff" stroke="#e7e0d3"/>

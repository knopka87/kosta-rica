  <ellipse cx="368" cy="366" rx="56" ry="26" fill="#7dd3fc" stroke="#0ea5e9"/>
  <ellipse cx="512" cy="374" rx="44" ry="21" fill="#38bdf8" stroke="#0ea5e9"/>
  <text x="368" y="371" font-size="11" fill="#075985" text-anchor="middle">бассейн</text>
  <text x="512" y="378" font-size="10" fill="#075985" text-anchor="middle">бассейн</text>
  <rect x="312" y="408" width="126" height="30" rx="8" fill="#fde68a"/>

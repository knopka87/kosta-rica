    <path d="M696,94 H712"/><path d="M696,150 H712"/><path d="M696,206 H712"/><path d="M696,262 H712"/>
    <path d="M696,318 H712"/><path d="M696,374 H712"/><path d="M696,430 H712"/><path d="M696,486 H712"/>

    <text x="14" y="24" font-size="12.5" font-weight="800" fill="#57534e" letter-spacing="1">ЛЕГЕНДА</text>
    <rect x="14" y="34" width="16" height="12" rx="3" fill="#0f766e"/><text x="38" y="44" font-size="12.5" fill="#44403c">отель</text>
    <rect x="94" y="34" width="16" height="12" rx="3" fill="#7dd3fc"/><text x="118" y="44" font-size="12.5" fill="#44403c">бассейн</text>
    <rect x="14" y="54" width="16" height="12" rx="3" fill="#f5e6c8"/><text x="38" y="64" font-size="12.5" fill="#44403c">пляж</text>
    <rect x="94" y="54" width="16" height="12" rx="3" fill="#94a3b8"/><text x="118" y="64" font-size="12.5" fill="#44403c">дорога</text>
    <text x="14" y="84" font-size="11.5" fill="#78716c">схема условная, не в масштабе</text>

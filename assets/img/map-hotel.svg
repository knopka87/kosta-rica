      <text x="726" y="332" fill="#78716c" font-size="12.5">продукты, фрукты, вода</text>
    </g>
    <g>
      <rect x="712" y="352" width="234" height="44" rx="10" fill="#fff" stroke="#e7e0d3"/>
      <text x="726" y="371" font-weight="700" fill="#1c1917">🍺 Бары · cervecerías</text>
